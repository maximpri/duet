<text x="32" y="164" font-size="14" font-weight="500" fill="#1f2328" text-anchor="start">No protection</text>
<rect x="230" y="148" width="280" height="22" rx="4" fill="#f6f8fa" stroke="#f6f8fa" stroke-width="1"/>
<rect x="230" y="148" width="270.30213243546575" height="22" rx="4" fill="#c85a1e" stroke="#c85a1e" stroke-width="1"/>
<text x="522" y="164" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">96.5%</text>
<line x1="600" y1="30" x2="600" y2="196" stroke="#d1d9e0" stroke-width="1"/>
