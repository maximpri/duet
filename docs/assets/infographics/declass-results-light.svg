<text x="928" y="182" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="end">in 1,328 requests</text>
<text x="32" y="234" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">Same frontier model (glm-5.3-flash) in both lanes. Zero matches does not rule out disclosure through summaries or inference.</text>
