<svg xmlns="http://www.w3.org/2000/svg" width="960" height="262" viewBox="0 0 960 262" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title>Benchmark: test scores and planted secrets</title><desc>Across 9 tasks run 3 times each, Declass scored 89.3% on hidden tests versus 96.5% for the same model with no protection. Planted secrets were found 0 times in Declass&#x27;s 1,124 cloud requests and 35,809 times in 1,328 unprotected requests.</desc>
