<text x="32" y="68" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">mean of 27 runs: 9 tasks × 3 runs, failures counted as zero</text>
<text x="32" y="120" font-size="14" font-weight="500" fill="#1f2328" text-anchor="start">Declass</text>
