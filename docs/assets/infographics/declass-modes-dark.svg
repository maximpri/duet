<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title>Declass&#x27;s two privacy modes</title><desc>Hybrid: the frontier model writes the code and sensitive files stay with the local model. Local-only: the local model does everything and nothing goes to the cloud.</desc>
<rect width="960" height="330" fill="#0d1117"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker></defs>
<rect x="234" y="24" width="330" height="282" rx="10" fill="#151b23" stroke="#16a596" stroke-width="1.5"/>
<text x="250" y="58" font-size="18" font-weight="600" fill="#f0f6fc" text-anchor="start">Hybrid</text>
<text x="250" y="80" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">default</text>
<rect x="584" y="24" width="330" height="282" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="600" y="58" font-size="18" font-weight="600" fill="#f0f6fc" text-anchor="start">Local-only</text>
<text x="600" y="80" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">declass --mode local-only</text>
<line x1="32" y1="138" x2="928" y2="138" stroke="#3d444d" stroke-width="1"/>
<text x="32" y="124" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">Writes the code</text>
<text x="250" y="124" font-size="14" font-weight="500" fill="#f0f6fc" text-anchor="start">Frontier model</text>
<text x="600" y="124" font-size="14" font-weight="500" fill="#f0f6fc" text-anchor="start">Your local model</text>
<line x1="32" y1="178" x2="928" y2="178" stroke="#3d444d" stroke-width="1"/>
<text x="32" y="164" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">Reads sensitive files</text>
<text x="250" y="164" font-size="14" font-weight="500" fill="#f0f6fc" text-anchor="start">Your local model</text>
<text x="600" y="164" font-size="14" font-weight="500" fill="#f0f6fc" text-anchor="start">Your local model</text>
<line x1="32" y1="218" x2="928" y2="218" stroke="#3d444d" stroke-width="1"/>
<text x="32" y="204" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">Requests to the cloud</text>
<text x="250" y="204" font-size="14" font-weight="500" fill="#f0f6fc" text-anchor="start">Checked and logged</text>
<text x="600" y="204" font-size="14" font-weight="500" fill="#f0f6fc" text-anchor="start">None</text>
<line x1="32" y1="258" x2="928" y2="258" stroke="#3d444d" stroke-width="1"/>
<text x="32" y="244" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">Web tools</text>
<text x="250" y="244" font-size="14" font-weight="500" fill="#f0f6fc" text-anchor="start">On</text>
<text x="600" y="244" font-size="14" font-weight="500" fill="#f0f6fc" text-anchor="start">Off</text>
<line x1="32" y1="298" x2="928" y2="298" stroke="#3d444d" stroke-width="1"/>
<text x="32" y="284" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">Network for commands</text>
<text x="250" y="284" font-size="14" font-weight="500" fill="#f0f6fc" text-anchor="start">Package registries only</text>
<text x="600" y="284" font-size="14" font-weight="500" fill="#f0f6fc" text-anchor="start">Off</text>
</svg>
