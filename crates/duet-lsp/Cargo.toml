[package]
name = "duet-lsp"
description = "Language-server client: stdio JSON-RPC, lazily started sandboxed servers, UTF-16 positions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
duet-sandbox.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }
url = "2"

# A scripted language server for tests (in-process, and as a process through
# the sandbox). Never part of a release: tools/release.sh builds only `duet`.
[[bin]]
name = "duet-lsp-mock"
path = "src/bin/duet-lsp-mock.rs"
test = false

[dev-dependencies]
tempfile = "3"
