[package]
name = "duet-boundary"
description = "Security engine: classification, transformation, vault, handles, outbound gate and audit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
duet-provider.workspace = true
duet-fs.workspace = true
duet-config.workspace = true
duet-review.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
time.workspace = true
regex.workspace = true
tokio.workspace = true
tree-sitter.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-python.workspace = true
aho-corasick.workspace = true
toml.workspace = true
# URLs of requests to third parties (`third_party`).
url = "2"
# Reads the structure of imported rules' expressions (which groups hold the secret).
regex-syntax = "0.8"
bytes = { version = "1", optional = true }
futures-util = { workspace = true, optional = true }

[features]
# A scripted local model for tests in dependent crates.
test-support = ["dep:bytes", "dep:futures-util"]

[dev-dependencies]
tempfile = "3"
# The integration tests use `testing::canary`.
duet-boundary = { path = ".", features = ["test-support"] }
proptest.workspace = true
bytes = "1"
futures-util.workspace = true
tokio.workspace = true
