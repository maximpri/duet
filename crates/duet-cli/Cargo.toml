[package]
name = "duet-cli"
description = "Duet command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
duet-agent.workspace = true
duet-boundary.workspace = true
duet-provider.workspace = true
duet-config.workspace = true
duet-fs.workspace = true
duet-git.workspace = true
duet-mcp.workspace = true
duet-sandbox.workspace = true
duet-tui.workspace = true
duet-web.workspace = true
duet-egress.workspace = true
duet-lsp.workspace = true
url = "2"
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
uuid.workspace = true
time.workspace = true
rustix = { workspace = true, features = ["termios"] }
futures-util.workspace = true
# The chat console and run progress (all three already in Cargo.lock through ratatui).
crossterm = "0.29"
unicode-width = "0.2"
unicode-segmentation = "1"


[dev-dependencies]
# The workspace test reads a terminal's screen back (MIT).
vt100 = "0.16"
duet-boundary = { workspace = true, features = ["test-support"] }
duet-mcp = { workspace = true, features = ["test-support"] }
duet-provider = { workspace = true, features = ["test-support"] }
duet-fs = { workspace = true, features = ["fault-injection"] }
tempfile = "3"
bytes = "1"
futures-util.workspace = true
# The embedding tests check chain hashes.
sha2.workspace = true
hex.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "duet"
path = "src/main.rs"

# A program that embeds Duet through `main_with` (no test harness: the test
# binary is itself that program; see the file).
[[test]]
name = "embedded"
harness = false
