[package]
name = "duet-cli"
description = "Duet command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
duet-agent.workspace = true
duet-boundary.workspace = true
duet-provider.workspace = true
duet-config.workspace = true
duet-fs.workspace = true
duet-git.workspace = true
duet-mcp.workspace = true
duet-sandbox.workspace = true
duet-tui.workspace = true
duet-web.workspace = true
url = "2"
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
uuid.workspace = true
time.workspace = true
rustix.workspace = true
futures-util.workspace = true


[dev-dependencies]
duet-mcp = { workspace = true, features = ["test-support"] }
duet-provider = { workspace = true, features = ["test-support"] }
duet-fs = { workspace = true, features = ["fault-injection"] }
tempfile = "3"
bytes = "1"
futures-util.workspace = true

[[bin]]
name = "duet"
path = "src/main.rs"
