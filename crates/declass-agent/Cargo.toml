[package]
name = "declass-agent"
description = "Frontier loop, tools, transcript, context manager and cost ledger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Deliberately no dependency on the provider crate: the agent reaches models only
# through declass-boundary's gate (enforced by tools/gate.sh).
[dependencies]
declass-extensions.workspace = true
declass-boundary.workspace = true
declass-config.workspace = true
declass-fs.workspace = true
declass-sandbox.workspace = true
declass-git.workspace = true
declass-web.workspace = true
declass-egress.workspace = true
declass-mcp.workspace = true
declass-lsp.workspace = true
declass-review.workspace = true
url = "2"
serde.workspace = true
serde_json.workspace = true
futures-util.workspace = true
tokio.workspace = true
regex.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
base64.workspace = true
declass-boundary = { workspace = true, features = ["test-support"] }
declass-mcp = { workspace = true, features = ["test-support"] }
