[package]
name = "declass-governor"
description = "Memory governor for process trees: footprint limits, pressure brake, no survivors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
rustix.workspace = true
# Process tables (memory, CPU, parents) without spawning `ps`.
sysinfo = { version = "0.38", default-features = false, features = ["system"] }

# The memory measure on macOS: the physical footprint (resident and
# compressed), which is what the kernel's own memory limits count.
[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"

[dev-dependencies]
tempfile = "3"
