# Hand-written synthetic positives for the detection corpus (tests/corpus.rs).
# Never real credentials or real people: every secret-shaped value was drawn
# from a seeded generator; names and addresses are invented or fictional.
#
# A case with `rule` must be found by that imported rule (in `path` when
# given) and withheld; a case with `kind` and `value` must have `value`
# withheld as that kind. Positives for every imported rule are also generated
# from the rules' own expressions; the cases here are realistic forms.

# ---- imported rules: realistic forms

