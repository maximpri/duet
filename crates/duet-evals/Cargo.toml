[package]
name = "duet-evals"
description = "Duet evaluation harness: dogfood tasks, canaries, leak proxy, grading, judging, statistics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
hex.workspace = true
time.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures-util.workspace = true
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

[dev-dependencies]
tempfile = "3"
# Tests only: the harness never links Duet at run time. Its price table is
# checked against the agent's built-in, cited prices, and its lanes' owner
# configs against Duet's settings registry.
duet-provider.workspace = true
duet-config.workspace = true

[[bin]]
name = "duet-eval"
path = "src/main.rs"
