# List prices in USD per million tokens. Gates use list prices even when the
# operator pays through a subscription. An entry with verified = false makes a
# lane's cost unknown instead of silently zero.

# Local electricity. US average residential rate; set to your own tariff.
electricity_usd_per_kwh = 0.182

[[price]]
model = "glm-5.3"
input = 1.40
cache_read = 0.26
# z.ai lists cached-input storage as "limited-time free"; writes bill as input.
cache_write = 1.40
output = 4.40
source = "https://docs.z.ai/guides/overview/pricing"
observed = "2026-09-23"
verified = true

