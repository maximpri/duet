# SPDX-License-Identifier: GPL-3.0-or-later
# Evaluation lanes. External agents are launched as black boxes for measurement
# only; their model traffic is forced through the leak proxy by the sandbox,
# which allows outbound network to loopback only.
#
# Placeholders: {workspace} {run_dir} {proxy_url} {objective} {model}
#
# `family` is the vendor family of the model that writes the lane's code (Duet
# lanes: the frontier model's; external lanes: their vendor's). The report flags
# runs judged by a judge of the same family.
#
# Duet lanes that use the local model reach it on the operator's LAN host over
# plain HTTP. Duet refuses that unless the owner config opts in, so their
# per-run owner config sets `local.allow_plaintext = true`: the operator accepts
# unencrypted traffic on that LAN segment. Planted canaries, not real data,
# cross it during evaluations.
#
# Every Duet lane has its own owner config (`DUET_CONFIG_HOME` in the run
# directory), so operator approval (`oversight.approve`) stays off: eval runs have
# no terminal, and duet refuses to start one with approval on.

[[lane]]
name = "duet-passthrough"
kind = "duet"
sandbox = false
upstream = "https://api.z.ai/api/coding/paas/v4"
model = "glm-5.3-flash"
family = "zhipu"
# The measured frontier-only baseline: the boundary is off, acknowledged explicitly.
argv = ["{duet_bin}", "run", "--mode", "passthrough", "--no-privacy", "--frontier-url", "{proxy_url}",
        "--frontier-model", "{model}", "--objective-file", "{run_dir}/objective.md"]
env_passthrough = ["ZAI_API_KEY", "OMLX_API_KEY"]
# Keep run state (audit anchors) inside the run directory, not the operator's state dir.
[lane.env]
DUET_CONFIG_HOME = "{run_dir}/duet-config"

[[lane]]
name = "duet-hybrid"
kind = "duet"
sandbox = false
upstream = "https://api.z.ai/api/coding/paas/v4"
model = "glm-5.3-flash"
family = "zhipu"
argv = ["{duet_bin}", "run", "--mode", "hybrid", "--frontier-url", "{proxy_url}",
        "--frontier-model", "{model}", "--objective-file", "{run_dir}/objective.md"]
env_passthrough = ["ZAI_API_KEY", "OMLX_API_KEY"]
# The local model host is on the LAN.
allow_hosts = ["192.168.50.132:8080"]
[lane.env]
DUET_CONFIG_HOME = "{run_dir}/duet-config"
[[lane.files]]
path = "{run_dir}/duet-config/config.toml"
content = '''
[local]
base_url = "http://192.168.50.132:8080/v1"
model = "omlx-coding"
api_key_env = "OMLX_API_KEY"
allowlist = ["192.168.50.132:8080"]
allow_plaintext = true
'''

# Privacy mode with local context compaction on (M5.2 item 2): the same as
# duet-hybrid plus `context.compaction = true`, so paired with duet-hybrid it
# measures what compaction saves and whether quality holds.
[[lane]]
name = "duet-hybrid-compact"
kind = "duet"
sandbox = false
upstream = "https://api.z.ai/api/coding/paas/v4"
model = "glm-5.3-flash"
family = "zhipu"
argv = ["{duet_bin}", "run", "--mode", "hybrid", "--frontier-url", "{proxy_url}",
        "--frontier-model", "{model}", "--objective-file", "{run_dir}/objective.md"]
env_passthrough = ["ZAI_API_KEY", "OMLX_API_KEY"]
allow_hosts = ["192.168.50.132:8080"]
[lane.env]
DUET_CONFIG_HOME = "{run_dir}/duet-config"
[[lane.files]]
path = "{run_dir}/duet-config/config.toml"
content = '''
[local]
base_url = "http://192.168.50.132:8080/v1"
model = "omlx-coding"
api_key_env = "OMLX_API_KEY"
allowlist = ["192.168.50.132:8080"]
allow_plaintext = true

[context]
compaction = true
'''

# The local explorer (M5.2 item 5): duet-hybrid with `explore.enabled = true`,
# so the frontier may hand where/what/how questions to the local model in one
# call. Paired with duet-hybrid it measures what the explorer saves.
[[lane]]
name = "duet-hybrid-explore"
kind = "duet"
sandbox = false
upstream = "https://api.z.ai/api/coding/paas/v4"
model = "glm-5.3-flash"
family = "zhipu"
argv = ["{duet_bin}", "run", "--mode", "hybrid", "--frontier-url", "{proxy_url}",
        "--frontier-model", "{model}", "--objective-file", "{run_dir}/objective.md"]
env_passthrough = ["ZAI_API_KEY", "OMLX_API_KEY"]
allow_hosts = ["192.168.50.132:8080"]
[lane.env]
DUET_CONFIG_HOME = "{run_dir}/duet-config"
[[lane.files]]
path = "{run_dir}/duet-config/config.toml"
content = '''
[local]
base_url = "http://192.168.50.132:8080/v1"
model = "omlx-coding"
api_key_env = "OMLX_API_KEY"
allowlist = ["192.168.50.132:8080"]
allow_plaintext = true

[explore]
enabled = true
'''

# Privacy mode with no local model (M5.2): the same engine as duet-hybrid, with
# `local.enabled = false`. Sensitive content reaches the frontier only as
# handles (sanitized error lines and line shapes); ask_local and edit_protected
# are refused. Paired with duet-hybrid it measures what the local model adds.
# No LAN host is allowed and no local key is passed: nothing reaches a local model.
[[lane]]
name = "duet-hybrid-nolocal"
kind = "duet"
sandbox = false
upstream = "https://api.z.ai/api/coding/paas/v4"
model = "glm-5.3-flash"
family = "zhipu"
argv = ["{duet_bin}", "run", "--mode", "hybrid", "--frontier-url", "{proxy_url}",
        "--frontier-model", "{model}", "--objective-file", "{run_dir}/objective.md"]
env_passthrough = ["ZAI_API_KEY"]
[lane.env]
DUET_CONFIG_HOME = "{run_dir}/duet-config"
[[lane.files]]
path = "{run_dir}/duet-config/config.toml"
content = '''
[local]
enabled = false
'''

[[lane]]
name = "duet-local-only"
kind = "duet"
sandbox = false
upstream = "https://api.z.ai/api/coding/paas/v4"
model = "glm-5.3-flash"
# No frontier model: the local model writes the code, and no judge shares its family.
family = "local"
argv = ["{duet_bin}", "run", "--mode", "local-only", "--objective-file", "{run_dir}/objective.md"]
env_passthrough = ["OMLX_API_KEY"]
allow_hosts = ["192.168.50.132:8080"]
[lane.env]
DUET_CONFIG_HOME = "{run_dir}/duet-config"
[[lane.files]]
path = "{run_dir}/duet-config/config.toml"
content = '''
[local]
base_url = "http://192.168.50.132:8080/v1"
model = "omlx-coding"
api_key_env = "OMLX_API_KEY"
allowlist = ["192.168.50.132:8080"]
allow_plaintext = true
'''

[[lane]]
name = "pi-glm"
kind = "external"
upstream = "https://api.z.ai/api/coding/paas/v4"
model = "glm-5.3-flash"
family = "zhipu"
argv = ["pi", "--offline", "--print", "--mode", "json", "--provider", "zai-proxy",
        "--model", "{model}", "--thinking", "medium", "--no-extensions", "--no-skills",
        "--no-prompt-templates", "--no-context-files", "--no-approve",
        "--tools", "read,bash,edit,write,grep,find,ls",
        "--session-dir", "{run_dir}/agent-sessions", "{objective}"]
env_passthrough = ["ZAI_API_KEY"]
[lane.env]
PI_CODING_AGENT_DIR = "{run_dir}/agent-config"
PI_OFFLINE = "1"
PI_TELEMETRY = "0"
[[lane.files]]
path = "{run_dir}/agent-config/models.json"
content = '''
{
  "providers": {
    "zai-proxy": {
      "baseUrl": "{proxy_url}",
      "api": "openai-completions",
      "apiKey": "$ZAI_API_KEY",
      "compat": { "supportsDeveloperRole": false },
      "models": [
        { "id": "{model}", "name": "{model}", "reasoning": true, "input": ["text"],
          "contextWindow": 200000, "maxTokens": 32768,
          "cost": { "input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0 } }
      ]
    }
  }
}
'''

# --- External lanes on the operator's CLI subscriptions (PLAN §3, 2026-09-24) ---
# No API keys. Each lane is smoke-tested with one run before M5: the run's
# proxy/requests.jsonl must show the model requests. The sandbox allows
# loopback only, so a lane that ignored the proxy settings would fail to reach
# its provider (an invalid run), never bypass the proxy.
# `duet-eval preflight --lanes claude-code,codex` checks the prerequisites.

[[lane]]
name = "claude-code"
kind = "external"
upstream = "https://api.anthropic.com"
model = "claude-sonnet-5"
family = "anthropic"
# Subscription token from `claude setup-token`; no API key to probe with.
probe = false
argv = ["claude", "-p", "{objective}", "--model", "{model}", "--output-format", "json",
        "--dangerously-skip-permissions", "--strict-mcp-config"]
env_passthrough = ["CLAUDE_CODE_OAUTH_TOKEN"]
[lane.env]
ANTHROPIC_BASE_URL = "{proxy_url}"
# Isolated per run: nothing from the operator's own Claude configuration.
CLAUDE_CONFIG_DIR = "{run_dir}/agent-config"
CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC = "1"
DISABLE_TELEMETRY = "1"
DISABLE_AUTOUPDATER = "1"
[lane.preflight]
env = ["CLAUDE_CODE_OAUTH_TOKEN"]
setup = [
  "Run `claude setup-token` once (it signs in with the Claude subscription and prints a long-lived token).",
  "Export it as CLAUDE_CODE_OAUTH_TOKEN in the shell that runs duet-eval (do not write it into lanes.toml or the repository).",
]

[[lane]]
name = "codex"
kind = "external"
# With a ChatGPT login Codex's built-in provider talks to the ChatGPT backend
# (https://chatgpt.com/backend-api/codex, requests to /responses), not to
# api.openai.com, so that is the proxy's upstream.
upstream = "https://chatgpt.com/backend-api/codex"
model = "gpt-5.5"
family = "openai"
probe = false
# `openai_base_url` (config key) and OPENAI_BASE_URL override the built-in
# provider's base URL for either login mode. Request compression is disabled:
# the proxy refuses bodies it cannot scan. The harness sandbox wraps the agent
# (macOS cannot nest sandboxes), so the agent's own sandbox is bypassed.
# Model traffic goes over a WebSocket (GET /responses, 101) when the upgrade
# succeeds, with POST /responses as fallback; this build cannot switch the
# WebSocket transport off, so the proxy reads the frames (leakproxy.rs).
# --ignore-user-config: only these overrides apply; auth still uses CODEX_HOME.
argv = ["codex", "exec", "--skip-git-repo-check", "--ephemeral", "--ignore-user-config",
        "--color", "never", "--json", "--dangerously-bypass-approvals-and-sandbox",
        "--disable", "enable_request_compression",
        "-c", "openai_base_url=\"{proxy_url}\"",
        "-m", "{model}", "{objective}"]
env_passthrough = []
# The dedicated evaluation login; the agent may refresh its tokens there.
writable = ["{operator_home}/.duet-eval/codex"]
[lane.env]
CODEX_HOME = "{operator_home}/.duet-eval/codex"
OPENAI_BASE_URL = "{proxy_url}"
[lane.preflight]
paths = ["{operator_home}/.duet-eval/codex/auth.json"]
not_copy_of = [["{operator_home}/.duet-eval/codex/auth.json", "{operator_home}/.codex/auth.json"]]
setup = [
  "mkdir -p ~/.duet-eval/codex && CODEX_HOME=~/.duet-eval/codex codex login   (sign in with ChatGPT in the browser)",
  "Never copy ~/.codex/auth.json there: refresh tokens rotate, and a copy logs one of the two out.",
  "Token refresh needs network the run sandbox blocks: if a run fails authentication, sign in again with CODEX_HOME=~/.duet-eval/codex codex login and re-run the batch (invalid runs are retried).",
]
notes = [
  "routing via openai_base_url/OPENAI_BASE_URL is read from this Codex build's config keys, not its docs; confirm with the one-run smoke test (proxy/requests.jsonl shows GET /responses with status 101 followed by WS message records, or POST /responses with status 200; proxy/ws.jsonl has no uninspected event).",
]
