[package]
name = "duet-web"
description = "Host-side web access for the frontier's web tools: guarded fetch and search backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Deliberately no dependency on the boundary: this crate only talks HTTP. What
# reaches the frontier is decided by the agent's presenter. `duet-mcp` (a leaf
# too) is the client for the GLM Coding Plan's search server.
[dependencies]
duet-mcp.workspace = true
reqwest.workspace = true
tokio.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url = "2"
ipnet = "2"
# Stack Exchange compresses every reply; already in the tree (through png).
flate2 = "1"

[dev-dependencies]
tokio.workspace = true
duet-mcp = { workspace = true, features = ["test-support"] }
