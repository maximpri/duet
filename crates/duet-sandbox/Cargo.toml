[package]
name = "duet-sandbox"
description = "Command sandbox (Seatbelt/bwrap), environment allowlist and process-tree control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tokio.workspace = true
thiserror.workspace = true
# `net`: the egress bridge hands connections over with SCM_RIGHTS.
rustix = { workspace = true, features = ["net"] }
# Holds every command's and server's process tree to memory limits.
duet-governor.workspace = true

# The egress bridge helper for this crate's tests (duet itself is the helper
# in a release: `duet __sandbox-bridge`). Never part of a release:
# tools/release.sh builds only `duet`.
[[bin]]
name = "duet-sandbox-bridge"
path = "src/bin/duet-sandbox-bridge.rs"
test = false

[dev-dependencies]
tempfile = "3"
