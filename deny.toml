# Dependency policy checked by `cargo deny check` in tools/gate.sh.
[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Permissive licenses compatible with GPL-3.0-or-later distribution.
allow = [
    "GPL-3.0-or-later", "GPL-3.0",
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "CC0-1.0", "MPL-2.0", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
