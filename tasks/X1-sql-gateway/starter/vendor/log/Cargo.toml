# Modified from upstream for Duet's X1 evaluation fixture; see the task's NOTES.md.
# Modification notice added 2026-10-02; original license notices are retained.
# Vendored copy of the `log` crate 0.4.29 (crates.io, MIT OR Apache-2.0),
# reduced to the manifest entries this repository needs so it builds offline.
# The optional key-value features (and their dependencies) are not available.
[package]
edition = "2021"
name = "log"
version = "0.4.29"
authors = ["The Rust Project Developers"]
description = "A lightweight logging facade for Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-lang/log"
autotests = false
autobenches = false

[lib]
name = "log"
path = "src/lib.rs"

[features]
std = []
max_level_off = []
max_level_error = []
max_level_warn = []
max_level_info = []
max_level_debug = []
max_level_trace = []
release_max_level_off = []
release_max_level_error = []
release_max_level_warn = []
release_max_level_info = []
release_max_level_debug = []
release_max_level_trace = []

[lints.rust]
unexpected_cfgs = "allow"
