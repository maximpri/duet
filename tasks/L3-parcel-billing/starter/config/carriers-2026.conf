# Carrier billing settings (2026 contracts, in production since 2026-07-01).
#
# 2026 format: the dimensional-weight divisor is now called volumetric_divisor
# (cm³ per kg), matching the carriers' contract wording. Other keys unchanged.
#
# fuel_pct: fuel surcharge on the base price, in percent
# remote_fee / oversize_fee: flat fees in EUR

[default]
fuel_pct = 12.0
volumetric_divisor = 5000
remote_fee = 4.90
oversize_fee = 18.00

